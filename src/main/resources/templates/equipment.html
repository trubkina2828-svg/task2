<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад магазина техники</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            margin: 0;
            padding: 30px;
            color: #263247;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 { margin-top: 0; }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        a, button {
            display: inline-block;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            background: #2864dc;
            color: white;
        }

        .delete { background: #d94343; }

        .search {
            margin: 25px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            padding: 10px;
            border: 1px solid #ccd2dc;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e8ef;
            text-align: left;
        }

        th { background: #edf1f8; }

        .empty {
            text-align: center;
            color: #777;
            padding: 25px;
        }

        .chart-container {
            width: 100%;
            max-width: 900px;
            margin: 25px auto;
        }
    </style>
</head>

<body>
<div class="container">

    <div class="top">
        <h1>Склад магазина техники</h1>

        <div>
            <a th:href="@{/equipment/new}">
                + Добавить технику
            </a>

            <a th:href="@{/shipments/new}"
               style="background: #15965b; margin-left: 10px;">
                Оформить отгрузку
            </a>
        </div>
    </div>

    <h3>
        Всего единиц техники:
        <span th:text="${totalCount}">0</span>
    </h3>

    <form class="search" method="get" th:action="@{/equipment}">
        <input type="text" name="type" placeholder="Тип техники">

        <input type="date" name="arrivalDate">

        <button type="submit">Найти</button>

        <a th:href="@{/equipment}">Сбросить</a>
    </form>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Тип</th>
            <th>Количество</th>
            <th>Цена</th>
            <th>Дата поступления</th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="item : ${equipmentList}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.name}"></td>
            <td th:text="${item.type}"></td>
            <td th:text="${item.quantity}"></td>
            <td th:text="${item.price}"></td>
            <td th:text="${item.arrivalDate}"></td>

            <td>
                <a th:href="@{/equipment/edit/{id}(id=${item.id})}">
                    Изменить
                </a>

                <form th:action="@{/equipment/delete/{id}(id=${item.id})}"
                      method="post"
                      style="display:inline;">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <button type="submit" class="delete">
                        Удалить
                    </button>
                </form>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(equipmentList)}">
            <td colspan="7" class="empty">
                На складе пока нет техники
            </td>
        </tr>
        </tbody>
    </table>

    <hr style="margin: 35px 0;">

    <h2>Гистограмма отгрузок за последние 30 дней</h2>

    <div class="chart-container">
        <canvas id="shipmentChart"></canvas>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    fetch('/api/shipments/statistics')
        .then(response => {
            if (!response.ok) {
                throw new Error('Не удалось загрузить статистику');
            }

            return response.json();
        })
        .then(data => {
            const labels = data.map(item => {
                const parts = item.date.split('-');
                return parts[2] + '.' + parts[1] + '.' + parts[0];
            });
            const quantities = data.map(item => item.quantity);

            const ctx = document.getElementById('shipmentChart');

            new Chart(ctx, {
                type: 'bar',

                data: {
                    labels: labels,

                    datasets: [{
                        label: 'Количество отгруженной техники',
                        data: quantities,
                        backgroundColor: 'rgba(54, 162, 235, 0.6)',
                        borderColor: 'rgb(54, 162, 235)',
                        borderWidth: 1
                    }]
                },

                options: {
                    responsive: true,

                    scales: {
                        y: {
                            beginAtZero: true,

                            title: {
                                display: true,
                                text: 'Количество'
                            }
                        },

                        x: {
                            title: {
                                display: true,
                                text: 'Дата'
                            }
                        }
                    }
                }
            });
        })
        .catch(error => {
            console.error('Ошибка загрузки статистики:', error);
        });
</script>

</body>
</html>
