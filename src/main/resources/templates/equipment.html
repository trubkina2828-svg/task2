<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад магазина техники</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            margin: 0;
            padding: 30px;
            color: #263247;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        a, button {
            display: inline-block;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            background: #2864dc;
            color: white;
        }

        .delete {
            background: #d94343;
        }

        .search {
            margin: 25px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            padding: 10px;
            border: 1px solid #ccd2dc;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e8ef;
            text-align: left;
        }

        th {
            background: #edf1f8;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 25px;
        }
    </style>
</head>
<body>
<div class="container">

    <div class="top">
        <h1>Склад магазина техники</h1>
        <a th:href="@{/equipment/new}">+ Добавить технику</a>
    </div>

    <h3>
        Всего единиц техники:
        <span th:text="${totalCount}">0</span>
    </h3>

    <form class="search" method="get" th:action="@{/equipment}">
        <input type="text" name="type"
               placeholder="Тип техники">

        <input type="date" name="arrivalDate"
               placeholder="Дата поступления">

        <button type="submit">Найти</button>
        <a th:href="@{/equipment}">Сбросить</a>
    </form>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Тип</th>
            <th>Количество</th>
            <th>Цена</th>
            <th>Дата поступления</th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="item : ${equipmentList}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.name}"></td>
            <td th:text="${item.type}"></td>
            <td th:text="${item.quantity}"></
